<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Assista aos melhores momentos da Grip Racing. Vídeos de corridas, highlights, ultrapassagens épicas e muito mais do automobilismo virtual.">
    <meta name="keywords" content="vídeos grip racing, corridas virtuais, highlights racing, automobilismo virtual brasil, sim racing videos">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gripracing.com.br/videos.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gripracing.com.br/videos.html">
    <meta property="og:title" content="Vídeos - Grip Racing">
    <meta property="og:description" content="Assista aos melhores momentos da Grip Racing em vídeo.">
    <meta property="og:image" content="https://gripracing.com.br/assets/Grip Racing Logo - Orange Black.png">
    
    <title>Vídeos - Grip Racing | Melhores Momentos</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EXXYMDS32C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EXXYMDS32C');
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/videos.css">
    <link rel="stylesheet" href="css/racing.css">
</head>
<body>
    <!-- Navigation -->
    <div id="header-container"></div>

    <main class="videos-main" id="conteudo">
        <section class="videos-hero">
            <div class="container videos-hero-inner">
                <span class="videos-eyebrow"><span class="videos-rec-dot" aria-hidden="true"></span>Replay &middot; Highlights &middot; Onboard</span>
                <h1 class="hero-title">V&iacute;deos Grip Racing</h1>
                <p class="hero-subtitle videos-hero-sub">Ultrapassagens, corridas hist&oacute;ricas, forfuns e os memes que viraram lenda no grid. <span id="videosCount" class="videos-count"></span></p>
            </div>
        </section>

        <section class="videos-content">
            <div class="container">
                <nav class="videos-nav" aria-label="Categorias de v&iacute;deos">
                    <div id="videosChips" class="videos-chips" role="group" aria-label="Filtrar por categoria"></div>
                </nav>

                <div id="videos-grid" class="videos-grid">
                    <!-- Videos serão carregados aqui -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <!-- Player em modo "teatro" -->
    <div id="videoTheater" class="videos-theater" hidden>
        <div class="videos-theater-dialog" role="dialog" aria-modal="true" aria-labelledby="videoTheaterTitle">
            <div class="videos-theater-bar">
                <span class="videos-theater-tag">Replay</span>
                <h2 id="videoTheaterTitle" class="videos-theater-title">-</h2>
                <button type="button" class="videos-theater-close" id="videoTheaterClose" aria-label="Fechar v&iacute;deo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="videos-theater-frame" id="videoTheaterFrame"></div>
            <p class="videos-theater-desc" id="videoTheaterDesc"></p>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/components-loader.js"></script>
    <script src="js/videos.js"></script>
    <script src="js/analytics-events.js"></script>
</body>
</html>
