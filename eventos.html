<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Eventos especiais da Grip Racing em WES e iRacing. Confira nossa participação em endurance, 24 horas e outras competições especiais.">
    <meta name="keywords" content="eventos grip racing, endurance racing, 24 horas, WES, iRacing events, corridas especiais">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gripracing.com.br/eventos.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gripracing.com.br/eventos.html">
    <meta property="og:title" content="Eventos - Grip Racing">
    <meta property="og:description" content="Eventos especiais da Grip Racing em WES e iRacing. Endurance, 24 horas e mais.">
    <meta property="og:image" content="https://gripracing.com.br/assets/Grip Racing Logo - Orange Black.png">
    
    <title>Eventos - Grip Racing | Participações Especiais</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EXXYMDS32C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EXXYMDS32C');
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/eventos.css">
    <link rel="stylesheet" href="css/racing.css">
</head>
<body>
    <!-- Navigation -->
    <div id="header-container"></div>

    <main class="eventos-main" id="conteudo">
        <section class="eventos-hero">
            <div class="container eventos-hero-inner">
                <span class="eventos-eyebrow">Endurance &middot; 24H &middot; 12H &middot; Ovais</span>
                <h1 class="hero-title">Eventos Especiais</h1>
                <p class="hero-subtitle eventos-hero-sub"><span id="totalEventosHero">-</span> largadas em provas de resist&ecirc;ncia e eventos especiais no WES e no iRacing</p>
            </div>
        </section>

        <section class="eventos-content">
            <div class="container">
                <div class="eventos-telemetry" aria-label="Resumo dos eventos">
                    <div class="eventos-tele-cell">
                        <span class="eventos-tele-label">Eventos</span>
                        <span class="eventos-tele-value" id="totalEventos">-</span>
                    </div>
                    <div class="eventos-tele-cell">
                        <span class="eventos-tele-label">Participa&ccedil;&otilde;es</span>
                        <span class="eventos-tele-value" id="totalParticipacoesEventos">-</span>
                    </div>
                    <div class="eventos-tele-cell is-gold">
                        <span class="eventos-tele-label">Vit&oacute;rias</span>
                        <span class="eventos-tele-value" id="totalVitoriasEventos">-</span>
                    </div>
                    <div class="eventos-tele-cell is-orange">
                        <span class="eventos-tele-label">P&oacute;dios</span>
                        <span class="eventos-tele-value" id="totalPodiosEventos">-</span>
                    </div>
                </div>

                <div class="eventos-toolbar">
                    <div class="eventos-search">
                        <label for="searchInput" class="eventos-sr-only">Buscar evento, pista ou piloto</label>
                        <svg class="eventos-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input type="search" id="searchInput" placeholder="Evento, pista ou piloto..." autocomplete="off">
                    </div>

                    <div class="eventos-chips" role="group" aria-label="Filtrar eventos">
                        <button type="button" class="eventos-chip active" data-filter="all" aria-pressed="true">Todos <span class="eventos-chip-count" data-count="all"></span></button>
                        <button type="button" class="eventos-chip" data-filter="WES" aria-pressed="false">WES <span class="eventos-chip-count" data-count="WES"></span></button>
                        <button type="button" class="eventos-chip" data-filter="iRacing" aria-pressed="false">iRacing <span class="eventos-chip-count" data-count="iRacing"></span></button>
                        <button type="button" class="eventos-chip is-gold" data-filter="victories" aria-pressed="false">Vit&oacute;rias <span class="eventos-chip-count" data-count="victories"></span></button>
                        <button type="button" class="eventos-chip is-podium" data-filter="podiums" aria-pressed="false">P&oacute;dios <span class="eventos-chip-count" data-count="podiums"></span></button>
                    </div>
                </div>

                <div class="eventos-subbar">
                    <p class="eventos-status" id="eventosStatus" role="status" aria-live="polite"></p>
                    <div class="eventos-sort">
                        <label for="eventosSort">Ordenar</label>
                        <select id="eventosSort">
                            <option value="temporada:desc">Mais recentes</option>
                            <option value="temporada:asc">Mais antigos</option>
                            <option value="resultado:asc">Melhor resultado</option>
                            <option value="name:asc">Nome (A&ndash;Z)</option>
                            <option value="pilotos:desc">Mais pilotos</option>
                        </select>
                    </div>
                </div>

                <div id="eventosGrid" class="eventos-grid">
                    <div class="eventos-empty">Montando o grid&hellip;</div>
                </div>

                <div id="loadMoreBtn" style="display: none;"></div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <!-- Modal de Resultado do Evento -->
    <div id="eventoModal" class="modal-overlay eventos-modal-overlay" style="display: none;">
        <div class="modal-content evento-modal" role="dialog" aria-modal="true" aria-labelledby="modalEventoNome">
            <button type="button" class="evento-modal-close" onclick="closeEventoModal()" aria-label="Fechar resultado">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="evento-modal-header">
                <span class="evento-modal-eyebrow">Resultado final &middot; Grip Racing</span>
                <h2 id="modalEventoNome" class="evento-modal-title">-</h2>
                <div class="evento-modal-subtitle">
                    <span id="modalEventoLiga" class="evento-liga-tag">-</span>
                    <span id="modalEventoPista" class="evento-modal-meta">-</span>
                    <span id="modalEventoTemporada" class="evento-modal-meta">-</span>
                </div>
            </div>

            <div class="evento-modal-body">
                <!-- Resultados -->
                <div class="evento-modal-section">
                    <h3 class="evento-section-title">Classifica&ccedil;&atilde;o da equipe</h3>
                    <div id="modalResultados" class="evento-resultados-lista">
                        <!-- Preenchido via JavaScript -->
                    </div>
                </div>

                <!-- Transmissão -->
                <div id="modalTransmissaoContainer" class="evento-modal-transmission" style="display: none;">
                    <div class="evento-onair"><span class="evento-onair-dot" aria-hidden="true"></span>Transmiss&atilde;o</div>
                    <div class="evento-video-carousel">
                        <div id="modalTransmissao" class="evento-transmission-embed"></div>
                        <div id="modalVideoControls" class="evento-video-carousel-controls" style="display: none;">
                            <button type="button" id="modalVideoPrev" class="modal-carousel-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M15 18l-6-6 6-6"/>
                                </svg>
                                Anterior
                            </button>
                            <span id="modalVideoCounter" class="modal-carousel-counter" aria-live="polite">
                                Parte <span class="current-video">1</span> / <span class="total-videos">1</span>
                            </span>
                            <button type="button" id="modalVideoNext" class="modal-carousel-btn">
                                Pr&oacute;ximo
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M9 18l6-6-6-6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components-loader.js"></script>
    <script src="js/script.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/analytics-events.js"></script>
</body>
</html>
